[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "detekface"
version = "0.1.0"
description = "A reliable, beginner-friendly Python face detection package powered by YuNet and OpenCV"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Abishek" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.20",
    "opencv-python>=4.8",
]

[project.urls]
Homepage = "https://github.com/Abishek-C0DE5/DetekFace"
Repository = "https://github.com/Abishek-C0DE5/DetekFace.git"
Issues = "https://github.com/Abishek-C0DE5/DetekFace/issues"

[project.scripts]
detekface = "detekface.cli:main"

[project.optional-dependencies]
mediapipe = [
    "mediapipe>=0.10.0",
]
dev = [
    "pytest>=7.0",
    "build>=1.0",
    "twine>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
